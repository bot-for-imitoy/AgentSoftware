<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentCompany Collaboration Platform</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="logo">AC</span>
        <div class="brand-text">
          <h1>AgentCompany Multi-Role Collaboration Platform</h1>
          <div class="sub" id="sysInfo">Connecting…</div>
        </div>
      </div>
    </header>

    <div id="main">
      <aside id="sidebar">
        <div class="sidebar-title">Groups</div>
        <ul id="groupList"></ul>
        <div class="sidebar-foot">Live sync · shows conversations between members of the selected group</div>
      </aside>

      <section id="chat">
        <div id="chatHeader">
          <div class="chat-title" id="chatTitle">Select a group on the left</div>
          <div class="chat-members" id="chatMembers"></div>
        </div>

        <div id="talkBanner" class="hidden">
          <span class="pulse-dot"></span>
          <span id="talkBannerText"></span>
        </div>

        <div id="messageList">
          <div class="empty-tip">No messages yet — select a group on the left to see that group's chat</div>
        </div>

        <div id="inputBar">
          <textarea id="replyInput" rows="2" maxlength="2000"
                    placeholder="Input disabled — enabled only when a Leadership Group member is talking to you"
                    disabled></textarea>
          <div class="input-actions">
            <span class="input-hint" id="inputHint">Disabled</span>
            <button id="sendBtn" disabled>Send</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
